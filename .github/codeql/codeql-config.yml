name: "blockingmachine-codeql"

# Test suites deliberately hold the shapes the scanner looks for: unsafe-regex
# fixtures for the ReDoS checker, unescaped filter patterns, intentionally odd
# prototypes. Alerts there cannot point at shipped behavior, so test trees are
# excluded rather than "fixed" into weaker fixtures. Build output is excluded
# the same way — it is generated, not authored. vendor/ is third-party code
# carried verbatim for a security backport; its findings belong to upstream,
# and "fixing" them would break the diffability contract that lets the vendor
# copy be retired when upstream ships a real release.
paths-ignore:
  - "**/__tests__/**"
  - "vendor/**"
  - "**/dist/**"
  - "**/.webpack/**"
  - "**/out/**"
  - "**/coverage/**"
  - "**/node_modules/**"
