name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Workspace builds use transpile-only loaders, so a type error can pass the
      # build and only surface at runtime. Check types across every workspace.
      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build packages
        run: npm run build

      # Generated artifacts are only trustworthy if something re-derives them. The units above
      # re-fit the element weights; these checks cover what a unit test cannot reach without
      # duplicating a driver, and run after the build because they read compiled core output.
      - name: Verify generated artifacts
        run: |
          npm run check:element-weights
          npm run check:hotlist
          # The classifier's vendor vocabulary is derived from the shipped tier rulesets, so the
          # gate re-derives it here from the rules on disk — the same input a release uses — and
          # fails if the checked-in module no longer matches what the tiers justify.
          npm run check:vocabulary
          # The element corpus candidate queue is derived from the harvested real elements on
          # disk, and it is a queue rather than a corpus: this verifies the generated file
          # still matches a fresh harvest, and that nothing in it has quietly become a graded
          # case. Age is measured against the newest capture, not the clock, so the check is a
          # plain diff rather than a date that expires.
          npm run check:element-candidates
          # The tier rulesets are a hand-curated baseline in the repository and a compiled plan in
          # a packaged build; the check is provenance-aware, so this verifies the baseline's shape
          # and counts rather than comparing it to a hub list CI does not have.
          npm run check:tiers
