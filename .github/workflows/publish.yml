name: Release Packaging & Publishing

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-packages:
    name: Build NPM Packages & Extensions
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@greigh'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build

      - name: Package browser extensions
        run: npm run package:extension

      - name: Pack NPM tarballs
        run: |
          mkdir -p dist/release-assets
          cd packages/core && npm pack && mv blockingmachine-core-*.tgz ../../dist/release-assets/ && cd ../..
          cd packages/cli && npm pack && mv blockingmachine-cli-*.tgz ../../dist/release-assets/ && cd ../..
          cp dist/extensions/*.zip dist/release-assets/

      - name: Publish to GitHub Packages
        run: node scripts/publish-gpr.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload common release assets
        uses: actions/upload-artifact@v4
        with:
          name: package-and-extension-assets
          path: dist/release-assets/*

  build-electron:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo dependencies
        run: npm run build

      - name: Import Apple signing assets
        if: runner.os == 'macOS'
        env:
          # The secret holds the .p8 *contents* — forge wants a file path, so it
          # is materialized under $RUNNER_TEMP. APPLE_API_KEY only reaches the
          # environment when the Developer ID certificate also imported —
          # notarize refuses an adhoc-signed app, so exporting the key without a
          # working signature turns the whole leg red instead of just skipping
          # notarization.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_P12" ]; then
            printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/devid.p12"
            security create-keychain -p ci-keychain-pass "$RUNNER_TEMP/build.keychain"
            security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
            security unlock-keychain -p ci-keychain-pass "$RUNNER_TEMP/build.keychain"
            security import "$RUNNER_TEMP/devid.p12" -k "$RUNNER_TEMP/build.keychain" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
              -k ci-keychain-pass "$RUNNER_TEMP/build.keychain"
            security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain
            rm -f "$RUNNER_TEMP/devid.p12"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              chmod 600 "$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            fi
          else
            echo "No APPLE_CERTIFICATE_P12 secret — building signed-only/adhoc, no notarization"
          fi

      - name: Package and Make Electron App
        working-directory: packages/electron-app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make

      - name: Collect desktop release installers
        shell: bash
        run: |
          mkdir -p dist/desktop-assets
          find packages/electron-app/out/make -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist/desktop-assets/ \;
          ls -la dist/desktop-assets/

      - name: Upload desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-assets-${{ matrix.platform }}
          path: dist/desktop-assets/*

  create-release:
    name: Draft / Update GitHub Release
    needs: [build-packages, build-electron]
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release-artifacts
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            # workflow_dispatch / release events on a non-tag ref: the release
            # under construction is whatever version the checkout carries.
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Target Release Tag: $TAG"

          # Determine release notes file: tag v1.0.0-rc.7 → scripts/release-notes-rc7.md
          NOTES_FLAG=""
          RC_LABEL=$(echo "$TAG" | grep -oP 'rc\.?\d+' | tr -d '.' )
          CANDIDATE_NOTES="scripts/release-notes-${RC_LABEL}.md"
          if [[ -f "$CANDIDATE_NOTES" ]]; then
            NOTES_FLAG="--notes-file $CANDIDATE_NOTES"
          elif [[ -f "scripts/release-notes-rc7.md" ]]; then
            NOTES_FLAG="--notes-file scripts/release-notes-rc7.md"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            echo "Creating draft release $TAG..."
            gh release create "$TAG" release-artifacts/* --title "Blockingmachine $TAG" $NOTES_FLAG --draft
          fi
