name: "Blockingmachine"
description: "AI-powered adblock compiler, segregated DNS/Browser feed server, and local network defense hub."
version: "1.0.0"
slug: "blockingmachine"
url: "https://github.com/Greigh/Blockingmachine"
init: false
arch:
  - aarch64
  - amd64
  - armv7
ingress: true
ingress_port: 9191
panel_icon: "mdi:shield-lock"
ports:
  53/tcp: 53
  53/udp: 53
  9191/tcp: 9191
  9294/tcp: 9294
options:
  feed_port: 9191
  auto_compile_interval: "24h"
  enable_ai_radar: true
  https_filter: true
  dns_filter: false
  log_level: "info"
schema:
  feed_port: int
  feed_token: password?
  feed_source_url: str?
  feed_source_token: password?
  auto_compile_interval: list(disabled|12h|24h|weekly)
  enable_ai_radar: bool
  https_filter: bool
  https_data_port: int?
  https_data_token: password?
  dns_filter: bool
  dns_port: int?
  dns_upstream: str?
  log_level: list(info|debug|warning|error)
