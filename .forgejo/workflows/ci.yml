name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Node 24.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Build before the suites: the CLI package's types resolve through `@blockingmachine/core`'s
      # `dist/`, so a clean checkout cascades `any` errors through everything until the workspace
      # build has run. Same ordering fix as `.github/workflows/ci.yml`.
      - name: Build packages
        run: npm run build

      - name: Run unit tests
        run: npm test
